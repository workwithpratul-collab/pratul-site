<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pratul · The Ascent</title>
  <meta name="description" content="Pratul builds websites that stand out, for businesses that refuse to blend in.">

  <!-- Fonts: a soft serif for headlines, a mono for small labels. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <!-- An empty icon, so the browser stops asking for favicon.ico. -->
  <link rel="icon" href="data:,">

  <link rel="stylesheet" href="css/style.css">

  <!--
    The import map tells the browser where to find each library when our code says
    `import ... from 'three'`. Every version is pinned, so the site never changes
    by surprise when a library publishes an update.
  -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js",
      "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.15.1/index.js",
      "gsap/ScrollTrigger": "https://cdn.jsdelivr.net/npm/gsap@3.15.1/ScrollTrigger.js",
      "lenis": "https://cdn.jsdelivr.net/npm/lenis@1.3.27/dist/lenis.mjs"
    }
  }
  </script>
</head>
<body>
  <!-- The 3D world is drawn here. It stays fixed behind everything. -->
  <canvas id="scene" aria-hidden="true"></canvas>

  <!-- Painterly finishing layers: a faint paper grain and a soft dark edge (vignette). -->
  <div id="vignette" aria-hidden="true"></div>
  <div id="grain" aria-hidden="true"></div>

  <!-- A soft black cover that fades away once the world is ready. -->
  <div id="curtain" aria-hidden="true"></div>

  <!-- All real text lives in this HTML layer, on top of the canvas. -->
  <div id="overlay">
    <header class="intro" id="intro">
      <p class="intro__hello">Hi, I'm Pratul.</p>
      <h1 class="intro__headline">I build websites that stand out, for businesses that refuse to blend in.</h1>
    </header>

    <p class="scroll-hint" id="scroll-hint">Scroll to begin the climb</p>

    <!-- Small label that floats next to the project tent (positioned by JavaScript). -->
    <p class="camp-label" id="label-dermae">DERMAÉ · Derma clinic · concept</p>

    <a class="skip" id="skip" href="#end">Skip film</a>

    <div class="fps" id="fps" hidden>-- fps</div>
  </div>

  <!--
    This tall empty block is what you actually scroll through.
    Its height decides how long the film lasts.
  -->
  <main id="scroll-track" aria-label="The Ascent, a scrolling film">
    <div id="end"></div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
