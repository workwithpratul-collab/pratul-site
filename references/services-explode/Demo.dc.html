<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Services explosion: playable demo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>body{margin:0} input[type=range]{accent-color:#F6A04D}</style>
</helmet>
<div style="width: 1440px; height: 900px; background: #120F22; font-family: Manrope, sans-serif; color: #F3ECE2">
  <dc-import name="Explode" progress="{{p}}" hint-size="1440px,810px"></dc-import>
  <div style="height: 90px; box-sizing: border-box; padding: 0 40px; display: flex; align-items: center; gap: 22px; border-top: 1px solid rgba(201,190,221,0.14)">
    <button onClick="{{toggle}}" style="height: 48px; min-width: 120px; border-radius: 24px; border: 0; background: #F6A04D; color: #1D1932; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer">{{playLabel}}</button>
    <label style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #9C90B8">
      <span style="font-family: 'JetBrains Mono', monospace; letter-spacing: 0.14em">SCROLL POSITION · DRAG ME</span>
      <input type="range" min="0" max="1000" value="{{pInt}}" onInput="{{scrub}}" style="width: 100%">
    </label>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.1em; color: #F6C38F; min-width: 260px; text-align: right">{{beat}}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { p: 0, playing: false }; }
  componentWillUnmount(){ clearInterval(this.t); }
  play(){
    clearInterval(this.t);
    let p = this.state.p >= 1 ? 0 : this.state.p;
    this.setState({ playing: true, p });
    this.t = setInterval(() => {
      p = Math.min(1, p + 1 / (18 * 60));
      this.setState({ p });
      if (p >= 1) { clearInterval(this.t); this.setState({ playing: false }); }
    }, 1000 / 60);
  }
  stop(){ clearInterval(this.t); this.setState({ playing: false }); }
  renderVals() {
    const p = this.state.p;
    const beats = [[0.10,'0 · INTRO: FLAT WEBSITE'],[0.25,'1 · EXPLOSION'],[0.37,'2 · FILM LAYER'],[0.49,'3 · INTERACTION LAYER'],[0.61,'4 · LAYOUT LAYER'],[0.73,'5 · COMMERCE LAYER'],[0.85,'6 · CODE LAYER'],[1.01,'7 · BACK TOGETHER']];
    const beat = beats.find((b) => p < b[0])[1];
    return {
      p, pInt: Math.round(p * 1000), beat,
      playLabel: this.state.playing ? '❚❚ Pause' : (p >= 1 ? '↺ Replay' : '▶ Play'),
      toggle: () => this.state.playing ? this.stop() : this.play(),
      scrub: (ev) => { this.stop(); this.setState({ p: Number(ev.target.value) / 1000 }); }
    };
  }
}
</script>
</body>
</html>
