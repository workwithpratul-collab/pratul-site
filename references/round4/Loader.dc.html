<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loading screen: snow fills the mountain</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes fall{from{transform:translate3d(0,-30px,0)}to{transform:translate3d(-40px,840px,0)}}
@keyframes drift{from{transform:translate3d(0,-30px,0) rotate(0deg)}to{transform:translate3d(160px,840px,0) rotate(540deg)}}
</style>
</helmet>
<div style="width: 1440px; height: 810px; position: relative; overflow: hidden; background: #17142B; font-family: Manrope, sans-serif; color: #F3ECE2">
  <img src="/_blob/461dbad535cff833c1c2565c4f250075" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%">
  <img src="/_blob/70e51c21ff7e2a4824302a745406007e" alt="" style="{{snowStyle}}">
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(23,20,43,0) 55%, rgba(23,20,43,0.75) 100%)"></div>

  <sc-for list="{{flakes}}" as="f" hint-placeholder-count="60"><span style="{{f.style}}"></span></sc-for>
  <sc-for list="{{petals}}" as="q" hint-placeholder-count="8"><span style="{{q.style}}"></span></sc-for>

  <div style="position: absolute; left: 0; right: 0; bottom: 92px; display: flex; flex-direction: column; align-items: center; gap: 16px">
    <div style="font-family: 'Instrument Serif', serif; font-size: 44px; line-height: 1">{{pct}}%</div>
    <div style="width: 240px; height: 3px; border-radius: 2px; background: rgba(243,236,226,0.22); overflow: hidden"><div style="{{barStyle}}"></div></div>
  </div>

  <div style="{{filmStyle}}">
    <img src="/_blob/97c5846300efc4b470b3fb91be1e7aee" alt="" style="width: 100%; height: 100%; object-fit: cover">
    <div style="position: absolute; left: 0; right: 0; bottom: 40px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.18em; color: #F3ECE2">THE FILM BEGINS</div>
  </div>

  <div style="position: absolute; right: 24px; top: 24px; display: flex; gap: 10px">
    <button onClick="{{play}}" style="height: 44px; padding: 0 20px; border-radius: 22px; border: 0; background: #F6A04D; color: #1D1932; font: inherit; font-weight: 700; cursor: pointer">{{playLabel}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":810}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { p: 0.6, done: false, playing: false }; }
  componentWillUnmount(){ clearInterval(this.t); }
  play(){
    clearInterval(this.t);
    let p = 0, target = 0, start = Date.now();
    this.setState({ p: 0, done: false, playing: true });
    this.t = setInterval(() => {
      const el = (Date.now() - start) / 1000;
      target = Math.min(1, el / 4.5);
      p += (target - p) * 0.06;
      if (target >= 1 && p > 0.998) p = 1;
      this.setState({ p });
      if (p >= 1) { clearInterval(this.t); setTimeout(() => this.setState({ done: true, playing: false }), 600); }
    }, 16);
  }
  renderVals() {
    const p = this.state.p;
    const edge = -20 + p * 120;
    const flakes = [];
    const N = 70, shown = Math.round(8 + p * (N - 8));
    for (let k = 0; k < N; k++) {
      const x = (k * 211) % 1440, s = 1.5 + (k % 4) * 0.8, dur = 7 + (k % 7) * 1.3, del = -((k * 1.7) % dur);
      flakes.push({ style: `position:absolute;left:${x}px;top:0;width:${s}px;height:${s}px;border-radius:50%;background:#FFF8F0;opacity:${k < shown ? 0.35 + (k % 3) * 0.2 : 0};transition:opacity 600ms;animation:fall ${dur}s linear ${del}s infinite` });
    }
    const petals = [];
    for (let k = 0; k < 8; k++) {
      const x = 40 + (k * 97) % 520, dur = 11 + k * 1.6, del = -((k * 3.1) % dur);
      petals.push({ style: `position:absolute;left:${x}px;top:0;width:9px;height:6px;border-radius:60% 40% 60% 40%;background:#F2B6C6;opacity:0.85;animation:drift ${dur}s linear ${del}s infinite` });
    }
    return {
      flakes, petals, pct: Math.round(p * 100),
      snowStyle: `position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;-webkit-mask-image:linear-gradient(180deg,#000 ${edge}%,transparent ${edge + 22}%);mask-image:linear-gradient(180deg,#000 ${edge}%,transparent ${edge + 22}%)`,
      barStyle: `height:100%;width:${p * 100}%;background:#F3ECE2;border-radius:2px;transition:width 120ms linear`,
      filmStyle: `position:absolute;inset:0;opacity:${this.state.done ? 1 : 0};transition:opacity 1200ms ease;pointer-events:none`,
      playLabel: this.state.playing ? 'Loading…' : '▶ Play the loading',
      play: () => this.play()
    };
  }
}
</script>
</body>
</html>
