<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hero: Gloock move, tucked behind the far mountains</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Gloock&amp;family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>body{margin:0} a{color:#F3ECE2;text-decoration:none}</style>
</helmet>
<div style="width: 1440px; height: 810px; position: relative; overflow: hidden; font-family: Manrope, sans-serif; color: #F3ECE2; background: #241D3A">
  <!-- 1. the full scene (sky at the back) -->
  <img src="/_blob/97c5846300efc4b470b3fb91be1e7aee" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
  <div style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(23,20,43,0.45) 0%, rgba(23,20,43,0.15) 38%, rgba(23,20,43,0) 55%)"></div>

  <!-- 2. BACK layer: any line set to "behind the mountains" -->
  <svg width="1440" height="810" viewBox="0 0 1440 810" style="position: absolute; inset: 0" aria-hidden="true">
    <text x="{{t1.x}}" y="{{t1.y}}" font-family="Instrument Serif, serif" font-size="{{t1.size}}" fill="{{t1.color}}" letter-spacing="{{t1.ls}}" opacity="{{t1.back}}">I build websites that</text>
    <text x="{{mv.x}}" y="{{mv.y}}" font-family="Gloock, serif" font-size="{{mv.size}}" fill="{{mv.color}}" letter-spacing="{{mv.ls}}" opacity="{{mv.back}}" style="{{mv.glow}}">move</text>
    <text x="{{t2.x}}" y="{{t2.y}}" font-family="Instrument Serif, serif" font-size="{{t2.size}}" fill="{{t2.color}}" letter-spacing="{{t2.ls}}" opacity="{{t2.back}}">business forward.</text>
  </svg>

  <!-- 3. the far mountains and everything below them, IN FRONT of the bottom of "move" -->
  <img src="/_blob/55998b14bff1c0d225d5ba811b655b2e" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">

  <!-- 4. FRONT layer: any line set to "in front of the mountains" -->
  <svg width="1440" height="810" viewBox="0 0 1440 810" style="position: absolute; inset: 0" aria-hidden="true">
    <text x="{{t1.x}}" y="{{t1.y}}" font-family="Instrument Serif, serif" font-size="{{t1.size}}" fill="{{t1.color}}" letter-spacing="{{t1.ls}}" opacity="{{t1.front}}" style="filter: drop-shadow(0 1px 10px rgba(40,25,60,0.5))">I build websites that</text>
    <text x="{{mv.x}}" y="{{mv.y}}" font-family="Gloock, serif" font-size="{{mv.size}}" fill="{{mv.color}}" letter-spacing="{{mv.ls}}" opacity="{{mv.front}}" style="{{mv.glow}}">move</text>
    <text x="{{t2.x}}" y="{{t2.y}}" font-family="Instrument Serif, serif" font-size="{{t2.size}}" fill="{{t2.color}}" letter-spacing="{{t2.ls}}" opacity="{{t2.front}}" style="filter: drop-shadow(0 1px 10px rgba(40,25,60,0.55))">business forward.</text>
  </svg>
  <h1 style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); margin: 0">I build websites that move business forward.</h1>

  <header style="position: absolute; left: 0; right: 0; top: 0; height: 84px; box-sizing: border-box; padding: 0 80px; display: flex; align-items: center; justify-content: space-between">
    <a href="#" style="font-family: 'Instrument Serif', serif; line-height: 1; display: flex; align-items: baseline"><span style="font-size: 36px">P</span><span style="font-size: 24px; letter-spacing: 0.07em">RATUL</span><span style="font-size: 20px; color: #F6A04D">.dev</span></a>
    <nav style="display: flex; align-items: center; gap: 32px; font-size: 15px"><a href="#">Services</a><a href="#">Work</a><a href="#">Process</a><a href="#">About</a><a href="#" style="height: 44px; padding: 0 20px; border-radius: 22px; background: #F6A04D; color: #1D1932; font-weight: 600; display: flex; align-items: center">Book a call</a></nav>
  </header>

  <div style="{{ctaStyle}}">
    <p style="margin: 0; font-size: 17px; line-height: 1.55; color: #F3ECE2; max-width: 420px; text-shadow: 0 1px 12px rgba(40,25,60,0.55)">Thoughtful design, careful engineering, and memorable digital experiences for ambitious businesses.</p>
    <div style="margin-top: 24px; display: flex; gap: 20px; align-items: center">
      <a href="#" style="height: 52px; padding: 0 26px; border-radius: 26px; background: #F6A04D; color: #1D1932; font-weight: 600; display: flex; align-items: center">Explore my work ↗</a>
      <a href="#" style="font-size: 15px; border-bottom: 1px solid rgba(243,236,226,0.6); padding-bottom: 3px; text-shadow: 0 1px 12px rgba(40,25,60,0.55)">▶ Watch showreel</a>
    </div>
  </div>
  <div style="position: absolute; left: 80px; bottom: 36px; border-left: 1px solid #F6A04D; padding-left: 12px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; line-height: 1.7">THE SUMMIT<br>ALT. 4,410 M</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{
"moveSize":{"editor":"range","min":120,"max":420,"step":2,"default":250,"unit":"px","section":"\"move\""},
"moveX":{"editor":"range","min":0,"max":900,"step":2,"default":70,"unit":"px","section":"\"move\""},
"moveY":{"editor":"range","min":200,"max":700,"step":1,"default":393,"unit":"px","section":"\"move\""},
"moveSpacing":{"editor":"range","min":-30,"max":30,"step":1,"default":-6,"section":"\"move\""},
"moveColor":{"editor":"color","default":"#F6A04D","options":["#F6A04D","#FFF3E2","#F2B6C6","#1D1932"],"section":"\"move\""},
"moveGlow":{"editor":"boolean","default":true,"section":"\"move\""},
"moveLayer":{"editor":"enum","options":["behind the mountains","in front of the mountains"],"default":"behind the mountains","section":"\"move\""},
"topSize":{"editor":"range","min":16,"max":90,"step":1,"default":32,"unit":"px","section":"I build websites that"},
"topX":{"editor":"range","min":0,"max":900,"step":2,"default":84,"unit":"px","section":"I build websites that"},
"topY":{"editor":"range","min":100,"max":700,"step":1,"default":258,"unit":"px","section":"I build websites that"},
"topColor":{"editor":"color","default":"#FFF6EA","options":["#FFF6EA","#F6A04D","#E4DAEE"],"section":"I build websites that"},
"topLayer":{"editor":"enum","options":["behind the mountains","in front of the mountains"],"default":"behind the mountains","section":"I build websites that"},
"bottomSize":{"editor":"range","min":16,"max":90,"step":1,"default":32,"unit":"px","section":"business forward."},
"bottomX":{"editor":"range","min":0,"max":900,"step":2,"default":84,"unit":"px","section":"business forward."},
"bottomY":{"editor":"range","min":200,"max":760,"step":1,"default":443,"unit":"px","section":"business forward."},
"bottomColor":{"editor":"color","default":"#FFF6EA","options":["#FFF6EA","#F6A04D","#E4DAEE"],"section":"business forward."},
"bottomLayer":{"editor":"enum","options":["behind the mountains","in front of the mountains"],"default":"in front of the mountains","section":"business forward."},
"ctaY":{"editor":"range","min":300,"max":700,"step":1,"default":475,"unit":"px","section":"Buttons"},
"$preview":{"width":1440,"height":810}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props, n = (k, d) => Number(p[k] ?? d);
    const lay = (k, d) => (p[k] ?? d) === 'behind the mountains';
    const item = (pre, d) => {
      const back = lay(pre + 'Layer', d.layer);
      return { x: n(pre + 'X', d.x), y: n(pre + 'Y', d.y), size: n(pre + 'Size', d.size), color: p[pre + 'Color'] ?? d.color, ls: d.ls, back: back ? 1 : 0, front: back ? 0 : 1 };
    };
    const mv = item('move', { x: 70, y: 393, size: 250, color: '#F6A04D', layer: 'behind the mountains', ls: n('moveSpacing', -6) });
    mv.glow = (p.moveGlow ?? true) ? 'filter: drop-shadow(0 0 28px rgba(255,190,120,0.35))' : '';
    return {
      mv,
      t1: item('top', { x: 84, y: 258, size: 32, color: '#FFF6EA', layer: 'behind the mountains', ls: 0.2 }),
      t2: item('bottom', { x: 84, y: 443, size: 32, color: '#FFF6EA', layer: 'in front of the mountains', ls: 0.2 }),
      ctaStyle: `position:absolute;left:80px;top:${n('ctaY', 475)}px`
    };
  }
}
</script>
</body>
</html>
