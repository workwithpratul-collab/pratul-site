<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone summit hero</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Manrope:wght@400;500;600&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Manrope, sans-serif; color: #F3ECE2; background: #241D3A">
  <img src="/_blob/9d1ff4f1357d8c1392c9ec6a0c0a766b" alt="The trekker standing on the summit beside an orange flag at sunrise" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 60% 50%">
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(23,20,43,0.82) 0%, rgba(23,20,43,0.45) 40%, rgba(23,20,43,0) 60%, rgba(23,20,43,0.35) 100%)"></div>
  <sc-for list="{{flakes}}" as="f" hint-placeholder-count="30"><span style="{{f.style}}"></span></sc-for>

  <div style="position: absolute; left: 20px; right: 20px; top: 18px; height: 48px; display: flex; align-items: center; justify-content: space-between">
    <a href="#" style="display: flex; align-items: center; gap: 8px; color: #F3ECE2; text-decoration: none; font-family: 'Instrument Serif', serif; font-size: 24px">
      <svg width="24" height="14" viewBox="0 0 24 14" aria-hidden="true"><polyline points="1,13 8,4 12,8 16,2 23,13" fill="none" stroke="#F6A04D" stroke-width="1.6" stroke-linejoin="round"></polyline></svg>Pratul</a>
    <a href="PhoneMenu.dc.html" aria-label="Open menu" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="16" viewBox="0 0 24 16" aria-hidden="true"><line x1="2" y1="2" x2="22" y2="2" stroke="#F3ECE2" stroke-width="1.6" stroke-linecap="round"></line><line x1="2" y1="8" x2="22" y2="8" stroke="#F3ECE2" stroke-width="1.6" stroke-linecap="round"></line><line x1="8" y1="14" x2="22" y2="14" stroke="#F3ECE2" stroke-width="1.6" stroke-linecap="round"></line></svg></a>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; top: 104px">
    <h1 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 44px; line-height: 1.06">I build websites that <span style="font-style: italic; color: #F6A04D">move</span> business forward.</h1>
    <p style="margin: 16px 0 0; font-size: 16px; line-height: 1.55; color: #E4DAEE; max-width: 300px">Thoughtful design, careful engineering, and memorable digital experiences.</p>
    <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 12px; width: 220px">
      <a href="#" style="height: 52px; border-radius: 26px; background: #F6A04D; color: #1D1932; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Explore my work ↗</a>
      <a href="#" style="height: 52px; border-radius: 26px; border: 1px solid rgba(243,236,226,0.45); color: #F3ECE2; display: flex; align-items: center; justify-content: center; text-decoration: none; background: rgba(23,20,43,0.25)">▶ Watch showreel</a>
    </div>
  </div>

  <div style="position: absolute; left: 24px; bottom: 34px; border-left: 1px solid #F6A04D; padding-left: 12px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em; line-height: 1.7">THE SUMMIT<br>ALT. 4,410 M</div>
  <a href="#" aria-label="Scroll down" style="position: absolute; right: 24px; bottom: 28px; width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(243,236,226,0.5); color: #F3ECE2; display: flex; align-items: center; justify-content: center; text-decoration: none">↓</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const flakes = [];
    for (let k = 0; k < 34; k++) {
      const x = (k * 97) % 390, y = (k * 211) % 844, s = 1.5 + (k % 3);
      flakes.push({ style: `position:absolute;left:${x}px;top:${y}px;width:${s}px;height:${s}px;border-radius:50%;background:rgba(255,248,240,${0.35 + (k%4)*0.12})` });
    }
    return { flakes };
  }
}
</script>
</body>
</html>
