<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Find the site's root first. The host shows this page for ANY missing address, however many
       folders deep (e.g. /pratul-site/a/b/c), and the address stays as typed, so the relative paths
       below (css/..., js/..., index.html) would be looked for inside those folders. A <base> makes
       them start from the site's root instead: on GitHub Pages (*.github.io) that's the first folder,
       the repository's name (/pratul-site/); on any other address (your own domain, Live Server) it's
       "/". It must come before every other link on the page. -->
  <script>
    (function () {
      var first = location.pathname.split('/')[1];
      var root = /\.github\.io$/.test(location.hostname) && first ? '/' + first + '/' : '/';
      var base = document.createElement('base');
      base.href = root;
      document.head.appendChild(base);
    })();
  </script>
  <!-- Which version this device gets (js/device.js): phones get the mobile styles below. -->
  <script src="js/device.js" data-preload="false"></script>
  <title>Off the trail · Pratul</title>
  <meta name="description" content="This page doesn't exist. Head back to base camp.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a1440">
  <!-- The tab icon: the P mark as a sharp SVG, with small PNGs for browsers that can't use SVG icons;
       the full P painting on a phone's home screen. -->
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/brand/p-mark-180.png">
  <!-- Self-hosted fonts (css/tokens.css). Only the headline face is fetched early. -->
  <link rel="preload" href="assets/fonts/instrument-serif-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/manrope-variable.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Relative paths, read from the site's root (the <base> above), so this page styles correctly for
       a missing address at any depth, at a domain root or in a subfolder. (Without JavaScript they
       still work for a missing page at the top level.) -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
  <main class="lost">
    <!-- A painted scene in the film's pre-dawn colours: layered ridges, mist drifting between them,
         and the trekker, small, wondering where the trail went. Pure HTML and CSS: no 3D. -->
    <div class="lost__layer" aria-hidden="true" style="height:62%">
      <svg viewBox="0 0 1600 400" preserveAspectRatio="none"><path class="descent__far" d="M0 220 L200 120 L360 190 L560 70 L760 180 L960 100 L1150 200 L1350 110 L1600 190 V400 H0Z"/></svg>
    </div>
    <div class="lost__mist" aria-hidden="true" style="top:46%"></div>
    <div class="lost__layer" aria-hidden="true" style="height:42%">
      <svg viewBox="0 0 1600 400" preserveAspectRatio="none"><path class="descent__mid" d="M0 250 L240 170 L470 230 L700 150 L940 240 L1180 180 L1400 250 L1600 200 V400 H0Z"/></svg>
    </div>
    <div class="lost__mist" aria-hidden="true" style="top:68%; animation-duration: 55s"></div>
    <div class="lost__layer" aria-hidden="true" style="height:22%">
      <svg viewBox="0 0 1600 400" preserveAspectRatio="none"><path class="lost__ground" d="M0 210 Q400 150 800 200 T1600 180 V400 H0Z"/></svg>
      <span class="lost__trekker"></span>
    </div>

    <div class="lost__text">
      <p class="section-heading__eyebrow">404 <span>Lost in the mist</span></p>
      <h1>Off the trail</h1>
      <p>This path doesn't lead anywhere. The page may have moved, or the address has a typo.</p>
      <a class="btn btn--primary" href="index.html">Head back to base camp<svg class="btn__arrow" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    </div>
  </main>
</body>
</html>
